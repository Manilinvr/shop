# ==========================================================================
# MANILI — сборка и публикация на GitHub Pages
#
# Секретов здесь нет и быть не может: всё, что попадает в сборку, видно
# в браузере. Ключи платежей, Telegram и доставки живут в переменных
# окружения серверных функций Appwrite (ТЗ §32, §47).
# ==========================================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные деплои не нужны: публикуем только последний коммит.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка типов
        run: npm run typecheck

      # Сначала — проверка выражениями, без передачи значений в шаг: GitHub
      # печатает блок env, и секрет из Variables попал бы в журнал раньше,
      # чем мы успели бы о нём предупредить. ${{ }} возвращает true/false.
      - name: Проверка адресов
        run: |
          for check in \
            "VITE_APPWRITE_ENDPOINT ${{ vars.VITE_APPWRITE_ENDPOINT == '' || startsWith(vars.VITE_APPWRITE_ENDPOINT, 'http') }}" \
            "VITE_API_BASE_URL ${{ vars.VITE_API_BASE_URL == '' || startsWith(vars.VITE_API_BASE_URL, 'http') }}" \
            "VITE_SITE_URL ${{ vars.VITE_SITE_URL == '' || startsWith(vars.VITE_SITE_URL, 'http') }}"
          do
            set -- $check
            if [ "$2" != "true" ]; then
              printf '%s\n' \
                "$1 не похоже на адрес — там должно быть https://..." \
                '' \
                'Если туда попал ключ или токен: Variables не маскируются' \
                'и вшиваются в скрипты сайта. Выпустите новый ключ, старый' \
                'удалите, а секрету место в Secrets.'
              exit 1
            fi
          done

      # Всё с префиксом VITE_ Vite вшивает в скрипты сайта, а сайт открыт
      # всем. Секрет, по ошибке положенный в Variables вместо Secrets, утёк
      # бы прямо в опубликованные файлы. Лучше красная сборка.
      - name: Проверка публичных переменных
        env:
          VITE_BACKEND: ${{ vars.VITE_BACKEND }}
          VITE_APPWRITE_ENDPOINT: ${{ vars.VITE_APPWRITE_ENDPOINT }}
          VITE_APPWRITE_PROJECT_ID: ${{ vars.VITE_APPWRITE_PROJECT_ID }}
          VITE_APPWRITE_DATABASE_ID: ${{ vars.VITE_APPWRITE_DATABASE_ID }}
          VITE_APPWRITE_BUCKET_ID: ${{ vars.VITE_APPWRITE_BUCKET_ID }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}
          VITE_SUPPORT_PHONE: ${{ vars.VITE_SUPPORT_PHONE }}
          VITE_SOCIAL_TELEGRAM: ${{ vars.VITE_SOCIAL_TELEGRAM }}
          VITE_SOCIAL_VK: ${{ vars.VITE_SOCIAL_VK }}
          VITE_MARKETPLACE_WB: ${{ vars.VITE_MARKETPLACE_WB }}
          VITE_MARKETPLACE_OZON: ${{ vars.VITE_MARKETPLACE_OZON }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
        run: node scripts/check-public-env.mjs

      # Адрес сайта зависит от того, подключён ли собственный домен.
      # Есть public/CNAME — сайт живёт в корне домена.
      # Нет — это проектная страница GitHub вида <логин>.github.io/<репо>/,
      # и сборке нужен базовый путь, иначе стили и скрипты не найдутся.
      # Определяем автоматически: вернёте CNAME — всё переключится само.
      - name: Определить адрес публикации
        id: site
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          owner="$(printf '%s' "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')"
          if [ -f public/CNAME ]; then
            domain="$(tr -d '[:space:]' < public/CNAME)"
            echo "base=/" >> "$GITHUB_OUTPUT"
            echo "url=https://$domain" >> "$GITHUB_OUTPUT"
            echo "Собственный домен: $domain"
          else
            echo "base=/$repo/" >> "$GITHUB_OUTPUT"
            echo "url=https://$owner.github.io/$repo" >> "$GITHUB_OUTPUT"
            echo "Домена нет, публикуем на https://$owner.github.io/$repo"
          fi

      - name: Сборка
        env:
          # Публичные значения. Задаются в Settings → Secrets and variables →
          # Actions → Variables (не Secrets: это не секреты).
          VITE_BACKEND: ${{ vars.VITE_BACKEND || 'mock' }}
          VITE_APPWRITE_ENDPOINT: ${{ vars.VITE_APPWRITE_ENDPOINT }}
          VITE_APPWRITE_PROJECT_ID: ${{ vars.VITE_APPWRITE_PROJECT_ID }}
          VITE_APPWRITE_DATABASE_ID: ${{ vars.VITE_APPWRITE_DATABASE_ID }}
          VITE_APPWRITE_BUCKET_ID: ${{ vars.VITE_APPWRITE_BUCKET_ID }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          # Переменная из настроек репозитория побеждает автоопределение
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL || steps.site.outputs.url }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || steps.site.outputs.base }}
          VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}
          VITE_SUPPORT_PHONE: ${{ vars.VITE_SUPPORT_PHONE }}
          VITE_SOCIAL_TELEGRAM: ${{ vars.VITE_SOCIAL_TELEGRAM }}
          VITE_SOCIAL_VK: ${{ vars.VITE_SOCIAL_VK }}
          VITE_MARKETPLACE_WB: ${{ vars.VITE_MARKETPLACE_WB }}
          VITE_MARKETPLACE_OZON: ${{ vars.VITE_MARKETPLACE_OZON }}
        run: npm run build

      # enablement: true переключает Pages в режим «GitHub Actions» через API.
      # Без этого при настройке «Deploy from a branch» окружение github-pages
      # отклоняет деплой мгновенно, ещё до запуска шагов.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
